name: Automated Daily Transaction ETL

on:
  schedule:
    - cron: '0 18 * * *'  # Berjalan pukul 18:00 UTC (Setara pukul 01:00 AM WIB)
  workflow_dispatch:      

jobs:
  run-etl-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Test Supabase Connection
        env:
          SUPABASE_URI: ${{ secrets.SUPABASE_URI }}

        run: |
          python -c "
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.pool import NullPool

          uri = os.environ['SUPABASE_URI']

          engine = create_engine(
              uri,
              poolclass=NullPool,
              connect_args={
                  'client_encoding': 'utf8'
              }
          )

          with engine.connect() as conn:
              result = conn.execute(text('SELECT 1'))
              print('Supabase connection successful:', result.scalar())
          "

      - name: Run ETL Transactions Pipeline
        env:
          SUPABASE_URI: ${{ secrets.SUPABASE_URI }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python etl_transactions_pipeline.py

      - name: Commit and Push changes (Archive files)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Pastikan folder incoming selalu tersedia
          mkdir -p data/transactions/incoming
          touch data/transactions/incoming/.gitkeep

          
          # Daftarkan semua perubahan di folder data
          git add data/transactions/incoming/ data/transactions/archive/
          
          # Lakukan commit, gunakan [skip ci] agar tidak memicu action berulang
          git commit -m "chore: archive processed transaction files [skip ci]" || echo "Tidak ada file baru untuk di-commit"
          
          # Push ke branch utama (main/master)
          git push